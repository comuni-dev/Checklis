<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Meta tags para evitar caché -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Checklis · Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <!-- CSS con cache-busting usando versión (se actualizará manualmente o con script) -->
    <link rel="stylesheet" href="css/style.css?v=1.0.1" />
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Checklis</h1>
                <p>Inicia sesión para continuar</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required autofocus />
                </div>

                <div class="input-group password-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required />
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar contraseña">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <a href="#" id="forgotPassword">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" id="loginButton">Iniciar sesión</button>

                <div id="messageContainer" class="message-container"></div>
            </form>

            <div class="login-footer">
                <span>Checklis v<span id="versionDisplay">1.0.0</span></span>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
            }
        }
    </script>

    <!-- JavaScript con cache-busting -->
    <script type="module" src="js/version-check.js?v=1.0.1"></script>
    <script type="module" src="js/firebase-config.js?v=1.0.1"></script>
    <script type="module" src="js/app.js?v=1.0.1"></script>
</body>
</html>
